<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biz Helper SA – Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%230b7a4b'/%3E
%3Cpath d='M120 220L152 140H360L392 220Z' fill='%23f2b705'/%3E
%3Ccircle cx='154' cy='220' r='34' fill='%23f2b705'/%3E%3Ccircle cx='222' cy='220' r='34' fill='%23ffd54a'/%3E%3Ccircle cx='290' cy='220' r='34' fill='%23f2b705'/%3E%3Ccircle cx='358' cy='220' r='34' fill='%23ffd54a'/%3E
%3Crect x='144' y='236' width='224' height='134' fill='%23fff'/%3E
%3Crect x='164' y='262' width='56' height='46' rx='8' fill='%23cfe9dc'/%3E
%3Crect x='232' y='290' width='48' height='80' rx='8' fill='%230b7a4b'/%3E
%3Crect x='292' y='262' width='56' height='46' rx='8' fill='%23cfe9dc'/%3E
%3Cpath d='M410 70L421 104L455 115L421 126L410 160L399 126L365 115L399 104Z' fill='%23fff'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0b7a4b">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#fff7e6;--card:#fff;--ink:#1d2b24;--mute:#5f6b64;--brand:#0b7a4b;--brand-ink:#fff;--line:#ecdcb8;--accent:#f2b705;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a15;--card:#18251e;--ink:#eef3ef;--mute:#9db0a4;--brand:#2bb673;--brand-ink:#06150d;--line:#2a3b32}}
:root[data-theme="dark"]{--bg:#101a15;--card:#18251e;--ink:#eef3ef;--mute:#9db0a4;--brand:#2bb673;--brand-ink:#06150d;--line:#2a3b32}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px}
.bar{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--brand),var(--accent));margin-bottom:12px}
h1{font-size:24px;line-height:1.2;margin:4px 0 4px}
h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--mute);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.stats{display:flex;gap:10px;margin-bottom:12px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:24px}
.stat span{color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.act{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:12px 4px;font-size:13px;line-height:1.3}
.act i{display:block;font-style:normal;font-size:24px}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:96px;resize:vertical}
button{font:inherit;font-weight:700;border:0;border-radius:12px;cursor:pointer}
.go{width:100%;margin-top:12px;padding:13px;background:var(--brand);color:var(--brand-ink);font-size:16px}
.go:disabled{opacity:.6}
.back{background:none;color:var(--brand);padding:6px 0;margin-bottom:6px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;padding:9px 6px;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-size:14px}
.tab[aria-selected="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.out{white-space:pre-wrap;word-wrap:break-word;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:80px}
.row{display:flex;gap:8px;margin-top:10px}
.row button,.row a{flex:1;text-align:center;padding:11px;border-radius:10px;font-weight:700;text-decoration:none;font-size:15px}
.copy{background:var(--ink);color:var(--bg)}
.wa{background:#25d366;color:#06240f}
.item{display:flex;justify-content:space-between;width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:10px 12px;margin-top:6px;font-weight:600;text-align:left}
.item span{color:var(--mute);font-weight:400;font-size:13px}
.msg{color:var(--mute);font-size:14px;margin-top:8px}
.err{color:#c0392b}
.brand{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,#0b7a4b,#14935c);color:#fff;border-radius:16px;padding:12px 14px;margin-bottom:14px}.brand img{height:62px;width:auto;max-width:100%;display:block}.brand b{display:block;font-size:20px;line-height:1.1}.brand span{font-size:12px;letter-spacing:2px;color:#ffd54a;font-weight:700}
.bar{display:none}
#splash{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:linear-gradient(135deg,#0b7a4b,#14935c);transition:opacity .6s ease,visibility .6s;animation:autohide .1s 6s forwards}
#splash img{width:min(78vw,340px);animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
#splash p{color:#ffd54a;font-weight:700;letter-spacing:2px;margin:0;animation:rise .8s .5s both}
#splash.out{opacity:0;visibility:hidden}
@keyframes pop{from{transform:scale(.3) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes autohide{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#splash img,#splash p{animation:none}}
.hide{display:none}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<div id="splash" aria-hidden="true"><img src="logo-white.svg" alt="Biz Helper South Africa"><p>WELCOME 👋</p></div>
<div class="wrap">
  <div class="brand"><img src="logo-white.svg" alt="Biz Helper South Africa"></div>

  <section id="auth" class="hide">
    <h1>Log in 👋</h1>
    <p class="sub">Log in or create a free account to use Biz Helper.</p>
    <div class="card">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
      <label for="pass">Password (6 or more characters)</label>
      <input id="pass" type="password" autocomplete="current-password">
      <button class="go" id="login">Log in</button>
      <button class="go" id="signup" style="background:var(--ink);color:var(--bg)">Create account</button>
      <div class="msg" id="amsg"></div>
    </div>
  </section>

  <section id="home" class="hide">
    <h1 id="hello">Welcome 👋</h1>
    <p class="sub">Your small business helper. Create content in seconds.</p>
    <div class="stats">
      <div class="stat"><b id="cnt">0</b><span>Things created</span></div>
      <div class="stat"><b id="last">–</b><span>Last created</span></div>
    </div>
    <div class="grid">
      <button class="act" data-k="price_list"><i>🏷️</i>Price list</button>
      <button class="act" data-k="facebook_post"><i>📣</i>Facebook post</button>
      <button class="act" data-k="whatsapp_message"><i>💬</i>WhatsApp message</button>
    </div>
    <div class="card">
      <h2>My business</h2>
      <label for="pname">Business name</label>
      <input id="pname" placeholder="e.g. Mama Thandi’s Spaza">
      <label for="ptype">Kind of business</label>
      <input id="ptype" placeholder="e.g. spaza shop, hair salon, kota stand">
      <label for="pwhere">Where are you?</label>
      <input id="pwhere" placeholder="e.g. Mamelodi, Pretoria">
      <label for="plang">Language</label>
      <select id="plang"><option>English</option><option>isiZulu</option><option>English + isiZulu mix</option><option>isiXhosa</option><option>Sesotho</option><option>Afrikaans</option></select>
      <button class="go" id="save">Save my business</button>
      <div class="msg" id="pmsg"></div>
    </div>
    <div class="card">
      <h2>Recent</h2>
      <div id="recent"></div>
    </div>
    <div class="msg" id="who"></div>
    <button class="back" id="logout">Log out</button>
  </section>

  <section id="create" class="hide">
    <button class="back" id="back">← Home</button>
    <div class="card" id="formcard">
      <label for="items">What do you sell? (add prices)</label>
      <textarea id="items" placeholder="e.g. bread R18, milk R25, airtime from R5, cooldrink R15"></textarea>
      <button class="go" id="go">Create my content ✨</button>
      <div class="msg" id="status"></div>
    </div>
    <div class="card hide" id="results">
      <div class="tabs">
        <button class="tab" data-k="price_list" aria-selected="true">Price list</button>
        <button class="tab" data-k="facebook_post" aria-selected="false">Facebook</button>
        <button class="tab" data-k="whatsapp_message" aria-selected="false">WhatsApp</button>
      </div>
      <div class="out" id="out"></div>
      <div class="row">
        <button class="copy" id="copy">Copy</button>
        <a class="wa" id="wa" href="https://wa.me/" target="_blank" rel="noopener">Send on WhatsApp</a>
      </div>
      <div class="msg" id="copied"></div>
    </div>
  </section>
</div>

<script>
(function(){
  // Put your Cloudflare Worker address here, e.g. "https://biz-helper-sa.yourname.workers.dev"
  var API_URL="https://whyiikmhzfmdknbwxmqj.supabase.co/functions/v1/generate";
  var API_KEY="sb_publishable_4FvzWpzEfL6hL47jaEFdGQ_n07dnN5l";
  var SUPA_URL="https://whyiikmhzfmdknbwxmqj.supabase.co";
  var sb=(window.supabase&&window.supabase.createClient)?window.supabase.createClient(SUPA_URL,API_KEY):null;
  var $=function(i){return document.getElementById(i)};
  var sample=null,data=null,focus="price_list";
  var P={name:"",type:"",where:"",lang:"English"},H=[];

  function ls(k,v){
    try{
      if(v===undefined){var r=localStorage.getItem(k);return r?JSON.parse(r):null;}
      localStorage.setItem(k,JSON.stringify(v));
    }catch(e){return null;}
  }
  P=ls("bh_profile")||P; H=ls("bh_hist")||[];
  if(!Array.isArray(H)){H=[];}

  if(window.claude&&claude.use){claude.use("sample").then(function(s){sample=s;}).catch(function(){});}

  function view(v){
    $("auth").classList.toggle("hide",v!=="auth");
    $("home").classList.toggle("hide",v!=="home");
    $("create").classList.toggle("hide",v!=="create");
    window.scrollTo(0,0);
    if(v==="home"){renderHome();}
  }

  function renderHome(){
    $("hello").textContent=P.name?"Welcome, "+P.name+" 👋":"Welcome 👋";
    $("cnt").textContent=H.length;
    $("last").textContent=H.length?new Date(H[0].ts).toLocaleDateString():"–";
    $("pname").value=P.name||""; $("ptype").value=P.type||""; $("pwhere").value=P.where||""; $("plang").value=P.lang||"English";
    var box=$("recent"); box.textContent="";
    if(!H.length){var m=document.createElement("div");m.className="msg";m.textContent="Nothing yet. Tap a button above to start.";box.appendChild(m);return;}
    H.forEach(function(h,i){
      var b=document.createElement("button");b.className="item";
      var a=document.createElement("div");a.textContent=h.name||"My business";
      var s=document.createElement("span");s.textContent=new Date(h.ts).toLocaleDateString();
      b.appendChild(a);b.appendChild(s);
      b.addEventListener("click",function(){data=h.data;$("formcard").classList.add("hide");view("create");$("results").classList.remove("hide");show("price_list");});
      box.appendChild(b);
    });
  }

  function show(k){
    var t=document.querySelectorAll(".tab");
    for(var i=0;i<t.length;i++){t[i].setAttribute("aria-selected",t[i].dataset.k===k?"true":"false");}
    var text=(data&&data[k])||"";
    $("out").textContent=text;
    $("wa").href="https://wa.me/?text="+encodeURIComponent(text);
    $("copied").textContent="";
  }

  var tabs=document.querySelectorAll(".tab");
  for(var i=0;i<tabs.length;i++){tabs[i].addEventListener("click",function(e){show(e.currentTarget.dataset.k);});}

  $("save").addEventListener("click",function(){
    P={name:$("pname").value.trim(),type:$("ptype").value.trim(),where:$("pwhere").value.trim(),lang:$("plang").value};
    ls("bh_profile",P); renderHome();
    $("pmsg").className="msg"; $("pmsg").textContent="Saved ✅";
  });

  var acts=document.querySelectorAll(".act");
  for(var j=0;j<acts.length;j++){acts[j].addEventListener("click",function(e){
    if(!P.name||!P.type){$("pmsg").className="msg err";$("pmsg").textContent="Add your business name and type first, then tap Save.";return;}
    focus=e.currentTarget.dataset.k;
    $("formcard").classList.remove("hide"); $("results").classList.add("hide"); $("status").textContent="";
    view("create");
  });}
  $("back").addEventListener("click",function(){view("home");});

  $("copy").addEventListener("click",function(){
    var text=$("out").textContent;
    try{navigator.clipboard.writeText(text).then(function(){$("copied").textContent="Copied ✅";},function(){$("copied").textContent="Press and hold the text to copy it.";});}
    catch(e){$("copied").textContent="Press and hold the text to copy it.";}
  });

  function buildPrompt(f){
    return "You help small South African businesses (spaza shops, salons, street food, township and informal traders). "+
      "Write simple, warm, friendly marketing content in "+f.lang+". Use South African Rand (R) and everyday local words. Do not invent prices; use only the items and prices given. "+
      "Business name: "+f.name+"\nType: "+f.type+"\nLocation: "+(f.where||"not given")+"\nItems and prices: "+f.items+"\n\n"+
      "Return ONLY JSON with exactly these string keys: "+
      "\"price_list\" (a neat price list with a title and one item per line, with emoji, ready to share), "+
      "\"facebook_post\" (an eye-catching Facebook post of 60-100 words with a few emoji and 3-5 hashtags, ending with a call to action), "+
      "\"whatsapp_message\" (a short friendly WhatsApp broadcast message under 70 words that customers can reply to).";
  }

  async function generate(f){
    if(sample){return await sample.json(buildPrompt(f));}
    var ses=sb?(await sb.auth.getSession()).data.session:null;
    if(!ses){var le=new Error("login");le.code="login";throw le;}
    var r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json","apikey":API_KEY,"Authorization":"Bearer "+ses.access_token},body:JSON.stringify(f)});
    if(!r.ok){var e=new Error("api");e.code="api";throw e;}
    return await r.json();
  }

  $("go").addEventListener("click",async function(){
    var st=$("status"); st.className="msg";
    var f={name:P.name,type:P.type,where:P.where,lang:P.lang,items:$("items").value.trim()};
    if(!f.items){st.className="msg err";st.textContent="Please type what you sell and the prices.";return;}
    if(!sample&&window.claude&&claude.use){try{sample=await claude.use("sample");}catch(e){}}
    if(!sample&&!API_URL){st.className="msg err";st.textContent="The AI isn’t connected yet. Please check back soon.";return;}
    var btn=$("go"); btn.disabled=true; st.textContent="Writing your content…";
    try{
      var res=await generate(f);
      if(res&&typeof res==="object"&&(res.price_list||res.facebook_post||res.whatsapp_message)){
        data={price_list:String(res.price_list||""),facebook_post:String(res.facebook_post||""),whatsapp_message:String(res.whatsapp_message||"")};
        H.unshift({ts:Date.now(),name:P.name,data:data}); H=H.slice(0,10); ls("bh_hist",H);
        $("results").classList.remove("hide"); show(focus); st.textContent="Done! Tap the tabs to see all three.";
        $("results").scrollIntoView({behavior:"smooth"});
      }else{throw new Error("bad");}
    }catch(e){
      st.className="msg err";
      st.textContent=(e&&e.code==="login")?"Please log in again.":(e&&e.code==="not_granted")?"Please allow the AI request to continue.":"Something went wrong. Please try again.";
    }
    btn.disabled=false;
  });

function amsg(t,err){var m=$("amsg");m.className=err?"msg err":"msg";m.textContent=t;}
  async function enter(session){
    $("who").textContent=session&&session.user?"Logged in as "+session.user.email:"";
    view("home");
  }
  $("login").addEventListener("click",async function(){
    if(!sb){amsg("Login is not available right now.",true);return;}
    var em=$("email").value.trim(),pw=$("pass").value;
    if(!em||pw.length<6){amsg("Enter your email and a password of 6 or more characters.",true);return;}
    amsg("Logging in…");
    var r=await sb.auth.signInWithPassword({email:em,password:pw});
    if(r.error){amsg(r.error.message,true);return;}
    amsg(""); enter(r.data.session);
  });
  $("signup").addEventListener("click",async function(){
    if(!sb){amsg("Login is not available right now.",true);return;}
    var em=$("email").value.trim(),pw=$("pass").value;
    if(!em||pw.length<6){amsg("Enter your email and a password of 6 or more characters.",true);return;}
    amsg("Creating your account…");
    var r=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});
    if(r.error){amsg(r.error.message,true);return;}
    if(r.data&&r.data.session){amsg("");enter(r.data.session);}
    else{amsg("Almost done! Check your email and tap the link to confirm, then log in.");}
  });
  $("logout").addEventListener("click",async function(){
    if(sb){await sb.auth.signOut();}
    view("auth");
  });
  (async function(){
    if(!sb){renderHome();view("home");return;}
    var s=await sb.auth.getSession();
    if(s.data&&s.data.session){enter(s.data.session);}else{view("auth");}
    sb.auth.onAuthStateChange(function(ev,sess){
      if(ev==="SIGNED_OUT"){view("auth");}
      else if(ev==="SIGNED_IN"&&sess&&!$("auth").classList.contains("hide")){enter(sess);}
    });
  })();
})();
</script>
<script>
(function(){
  var s=document.getElementById("splash"); if(!s){return;}
  var seen=false;
  try{seen=sessionStorage.getItem("bh_splash")==="1";sessionStorage.setItem("bh_splash","1");}catch(e){}
  if(seen){s.remove();return;}
  function close(){s.classList.add("out");setTimeout(function(){s.remove();},700);}
  s.addEventListener("click",close);
  setTimeout(close,2600);
})();
</script>
</body>
</html>
